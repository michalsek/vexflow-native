name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc

    # Cache Yarn's package archives rather than node_modules: react-native-skia
    # Graphite binaries install into every workspace's node_modules, while the
    # cache holds a single compressed copy of each package.
    - name: Get Yarn cache folder
      id: yarn-cache-dir
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Restore Yarn cache
      id: yarn-cache
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ steps.yarn-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-yarn-cache-${{ hashFiles('yarn.lock') }}

    - name: Install dependencies
      run: yarn install --immutable
      shell: bash

    - name: Save Yarn cache
      if: steps.yarn-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ steps.yarn-cache-dir.outputs.dir }}
        key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
